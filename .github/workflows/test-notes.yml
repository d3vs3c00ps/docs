name: Note tests

# Runs the commands from the notes in throwaway containers and a kind cluster, and
# checks what the notes claim. See tests/ and scripts/test-notes.sh.
#
# Run these tests locally before you push: `task tests:changed`, or `task test`.
# CI on pull requests runs only lint, build, shellcheck and coverage (ci.yml), to keep
# Actions usage low. This workflow is a manual extra, started from the Actions tab or
# with `gh workflow run test-notes.yml -f env=<env>`. It is the only place with KVM
# (NixOS VM tests in `# env: nix`, and the installer ISO) and with amd64.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Test environment; "all" runs every job and takes hours
        type: choice
        default: go
        options: [leap, leap-systemd, rocky, rocky-systemd, nix, nixos, go, task, compose, ansible-systemd, fedora-systemd, kind, iso, all]

permissions:
  contents: read

concurrency:
  group: note-tests-${{ github.ref }}-${{ inputs.env }}
  cancel-in-progress: true

jobs:
  containers:
    name: Tests (${{ matrix.env }})
    if: inputs.env != 'kind' && inputs.env != 'iso'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.env == 'all' && '["leap","leap-systemd","rocky","rocky-systemd","nix","nixos","go","task","compose","ansible-systemd","fedora-systemd"]' || format('["{0}"]', inputs.env)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runners have /dev/kvm but only root may open it. NixOS VM tests need it.
      - name: Enable KVM
        if: matrix.env == 'nix'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run
        run: scripts/test-notes.sh -j 4 --env ${{ matrix.env }}
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.env }}
          path: .test-results/
          # The folder name starts with a dot: upload-artifact skips it unless told.
          include-hidden-files: true

  nixos-iso:
    name: NixOS installer ISO
    if: inputs.env == 'iso' || inputs.env == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: scripts/install-vm-tools.sh
      - name: Build, install into a VM, boot it
        run: scripts/nixos-iso.sh test

  kubernetes:
    name: Tests (kind, k3d)
    if: inputs.env == 'kind' || inputs.env == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kind, k3d, kubectl, helm
        run: scripts/install-test-tools.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Several kind clusters at once exhaust the default inotify limits: nodes fail to
      # join and pods never start. These are the values the kind documentation gives.
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288
          sudo sysctl -w fs.inotify.max_user_instances=512
      - name: kind
        run: scripts/test-notes.sh --env kind --delete-cluster
      - name: k3d
        run: scripts/test-notes.sh --env k3d --delete-cluster
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-kubernetes
          path: .test-results/
          # The folder name starts with a dot: upload-artifact skips it unless told.
          include-hidden-files: true
